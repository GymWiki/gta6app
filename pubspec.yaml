name: vice_codes
description: Unofficial cheat & unlock tracker companion app for GTA VI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  http: ^1.2.1
  google_mobile_ads: ^5.1.0
  url_launcher: ^6.3.1 # opens the "report a missing cheat" e-mail

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - content.json
