name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: the newest stable deprecates package:flutter/material.dart.
          # Migrate, then unpin.
          flutter-version: 3.35.0
          cache: true
      - name: Validate cheat data
        run: python3 tool/validate_cheats.py --strict
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
